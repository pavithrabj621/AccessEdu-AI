<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | AccessEdu AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: #f7f7f8;
    }
    .admin-box {
      width: min(420px, 100%);
      background: white;
      border: 1px solid #e7e7eb;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 14px 35px rgba(35, 20, 28, .07);
    }
    h1 { margin-top: 0; color: #8c0034; }
    form { display: flex; flex-direction: column; gap: 14px; }
    label { font-weight: 700; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e7e7eb;
      font: inherit;
    }
    button {
      background: #8c0034;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .error { color: #b3261e; font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="admin-box">
    <h1>Admin Login</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
