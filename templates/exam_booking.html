{% extends "toolkit_base.html" %}
{% block form %}
<div class="form-grid">
  <div class="form-field"><label for="studentName">Student name</label><input id="studentName" name="student_name" required autocomplete="name"></div>
  <div class="form-field"><label for="examDate">Preferred date</label><input id="examDate" name="exam_date" type="text" placeholder="Say a date" required></div>
  <div class="form-field full"><label for="support">Accessibility support needed</label><textarea id="support" name="support" placeholder="Reader, scribe, extra time, accessible room, or none"></textarea></div>
</div>
{% endblock %}
