{% extends "toolkit_base.html" %}
{% block form %}
<div class="form-grid">
  <div class="form-field"><label for="studentName">Student name</label><input id="studentName" name="student_name" required autocomplete="name"></div>
  <div class="form-field"><label for="outDate">Leaving date</label><input id="outDate" name="leaving_date" type="text" placeholder="Say a date" required></div>
  <div class="form-field full"><label for="destination">Destination and reason</label><textarea id="destination" name="destination_reason" required></textarea></div>
</div>
{% endblock %}
